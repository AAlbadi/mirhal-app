    <rect x="360" y="380" width="180" height="90" rx="8" fill="white"/>
    <!-- Cab -->
    <path d="M540 380h60l20 90h-80v-90z" fill="white"/>
    <!-- Windows -->
    <rect x="375" y="395" width="35" height="30" rx="3" fill="#8b6f47"/>
    <rect x="425" y="395" width="50" height="30" rx="3" fill="#8b6f47"/>
    <rect x="490" y="395" width="35" height="30" rx="3" fill="#8b6f47"/>
    <rect x="555" y="395" width="35" height="30" rx="3" fill="#8b6f47"/>
