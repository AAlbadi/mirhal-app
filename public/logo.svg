    <rect x="495" y="420" width="25" height="50" rx="3" fill="#8b6f47"/>
    <circle cx="515" cy="445" r="2" fill="white"/>
    <!-- Stripes -->
    <line x1="370" y1="440" x2="530" y2="440" stroke="#8b6f47" stroke-width="3"/>
    <line x1="370" y1="455" x2="530" y2="455" stroke="#8b6f47" stroke-width="2"/>
    <!-- Wheels -->
